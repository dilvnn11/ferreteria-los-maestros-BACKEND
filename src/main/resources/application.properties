spring.application.name=ferreteria-los-maestros
server.port=8080

# ---------- Base de datos (MariaDB de XAMPP) ----------
# Si el MySQL de XAMPP corre en otro puerto (p. ej. 3307), cámbialo aquí.
spring.datasource.url=jdbc:mariadb://localhost:3306/ferreteria_los_maestros?createDatabaseIfNotExist=true
spring.datasource.username=root
# XAMPP trae root SIN contraseña por defecto
spring.datasource.password=

# JPA: crea/actualiza las tablas automáticamente a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Fechas en formato ISO (2026-01-10T12:00:00Z) y no como números
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Seguridad ----------
# Cambia este secreto (mínimo 32 caracteres) o define la variable de entorno JWT_SECRET
app.jwt.secret=${JWT_SECRET:ferreteria-los-maestros-clave-secreta-de-desarrollo-2026}
app.jwt.expiration-minutes=480

# Orígenes del frontend (Vite usa 5173)
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Inserta categorías, productos y las 3 cuentas demo si las tablas están vacías
app.seed.enabled=true

# ---------- Swagger / OpenAPI ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
